[project]
name = "naps-automatic-update"
version = "0.1.0"
description = "A simple update orchestrator for NAPS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anycorn>=0.20.1",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
]


[tool.uv]
package=true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naps_automatic_update"]

[project.scripts]
naps-automatic-update = "naps_automatic_update.main:main"


